<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OpenContainer — E2E harness</title>
  <link rel="stylesheet" href="/xterm.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e21; color: #d4d4d4;
                 font-family: ui-monospace, Menlo, monospace; }
    #bar { padding: 6px 10px; background: #17171a; border-bottom: 1px solid #2d2d33;
           font-size: 12px; color: #9aa0aa; }
    #bar b { color: #0d9fff; }
    #term { padding: 8px 10px; height: calc(100% - 32px); }
    #status { float: right; }
    .ok { color: #3fb950; } .bad { color: #f85149; }
  </style>
</head>
<body>
  <div id="bar">
    <b>OpenContainer</b> browser E2E harness
    <span id="status">booting…</span>
  </div>
  <div id="term"></div>
  <script src="/xterm.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
